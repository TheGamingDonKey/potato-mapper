name: Check published Windows download
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version to check (v0.9.13 or newer)
        required: true
        type: string
permissions:
  contents: read
jobs:
  open-in-downloads:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download both public assets and open the app from a fresh folder
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$'){throw 'Invalid release tag'}
          $release=gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot read release metadata'}
          $base='PotatoMapper-'+$env:RELEASE_TAG.Substring(1)+'-windows-x64'
          $dir=Join-Path $env:RUNNER_TEMP 'Téléchargements (雪)'
          New-Item -ItemType Directory -Path $dir | Out-Null
          foreach($ext in 'zip','exe'){
              $asset=@($release.assets | Where-Object name -eq "$base.$ext")
              if($asset.Count -ne 1){throw "Missing $ext download"}
              $file=Join-Path $dir $asset[0].name
              Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile $file
              if(('sha256:'+(Get-FileHash -LiteralPath $file).Hash.ToLowerInvariant()) -ne $asset[0].digest){throw "Incorrect $ext download hash"}
          }
          ./packaging/Test-WindowsDownload.ps1 -Archive (Join-Path $dir "$base.zip")
